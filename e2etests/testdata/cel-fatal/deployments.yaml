apiVersion: apps/v1
kind: Deployment
metadata:
  name: small
spec:
  replicas: 2
  selector:
    matchLabels:
      app: small
  template:
    metadata:
      labels:
        app: small
    spec:
      containers:
        - name: app
          image: nginx:1.25
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: big
spec:
  replicas: 9
  selector:
    matchLabels:
      app: big
  template:
    metadata:
      labels:
        app: big
    spec:
      containers:
        - name: app
          image: nginx:1.25
