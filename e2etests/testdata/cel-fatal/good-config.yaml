checks:
  addAllBuiltIn: false
customChecks:
  - name: "cel-replicas-limit"
    description: "flag deployments with more than 3 replicas"
    remediation: "reduce replicas"
    scope:
      objectKinds:
        - DeploymentLike
    template: "cel-expression"
    params:
      check: |
        object.spec.replicas > 3 ? "too many replicas" : ""
